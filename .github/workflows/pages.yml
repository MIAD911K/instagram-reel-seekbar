name: Package and publish extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        run: |
          rm -rf package reel-seekbar.zip
          mkdir -p package/reel-seekbar
          cp manifest.json content.js styles.css README.md package/reel-seekbar/
          cd package
          zip -r ../reel-seekbar.zip reel-seekbar

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp index.html reel-seekbar.zip _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
